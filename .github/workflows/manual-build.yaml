name: "Manual Build (APK)"

# This workflow is deliberately additive: it is a new file, so it can never conflict with the
# upstream workflows (build_commit.yaml / build_pull_request.yaml / testing.yml) when rebasing.
#
# Triggered by hand only, because build_commit.yaml already builds on every push. This one exists
# for the cases that one does not cover:
#   - rebuilding the current commit without pushing a new one
#   - building a *debug* APK, which skips R8/minification and is noticeably faster to iterate on
#   - building a non-github flavor (fdroid / googlePlay)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gradle assemble task"
        required: true
        default: "assembleGithubDebug"
        type: choice
        options:
          - assembleGithubDebug
          - assembleGithubRelease
          - assembleFdroidDebug
          - assembleFdroidRelease

# Least privilege: this workflow only reads the repo and uploads an artifact.
permissions:
  contents: read

# Pushing twice in quick succession should not leave two builds racing; the older one is useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle user home and the wrapper distribution between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew ${{ inputs.task }} --max-workers=2

      # The repo sets `all { signingConfig = signingConfigs.getByName("release") }`, and falls back
      # to the committed signature/keystore.properties when signature/keystore_release.properties is
      # absent. So both debug and release output here are already signed and installable.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReadYou-${{ inputs.task }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          # Fail loudly rather than uploading an empty artifact if the output path ever moves.
          if-no-files-found: error
