name: "Unit Tests (on push)"

# Fork-owned, like manual-build.yaml and release-build.yaml: a new file can never conflict with the
# upstream workflows when rebasing.
#
# Why this file has to exist. Upstream runs `testGithubReleaseUnitTest` from testing.yml, and
# testing.yml triggers on `pull_request` only. This fork follows upstream by rebasing locally rather
# than by opening pull requests, so with the upstream workflows alone the unit tests would never run
# here. build_commit.yaml does run on push, but it only calls `assembleGithubRelease`, which compiles
# the main source set and never touches `app/src/test`.
#
# That matters because ListFontBaselineTest is the alarm for a silent coupling: the list font
# baselines assume `MaterialTheme.typography.titleMedium.fontSize` is 16sp, and a Compose BOM bump can
# move that default without producing a single compile error. On a phone the page would just render
# at the wrong size. This workflow is what turns that into a failing check.
#
# It is also the only place these tests can run at all: the development machine has no JDK, no
# Android SDK and no Gradle cache, so `./gradlew` cannot be started there.
on:
  push:
  # So the suite can also be run on demand, without inventing a commit to push.
  workflow_dispatch:

# Least privilege: this workflow reads the repository and uploads a report, nothing else.
permissions:
  contents: read

# Two pushes in a row should not leave two test runs racing; the older one is useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle user home and the wrapper distribution between runs.
      - uses: gradle/actions/setup-gradle@v4

      # The same task upstream's testing.yml runs, so green here means the same thing as a green
      # "Run Unit Tests" check on a pull request.
      - name: Unit tests
        run: ./gradlew testGithubReleaseUnitTest --max-workers=2

      # A skipped test still leaves the job green. ListFontBaselineTest skips itself with Assume when
      # the Compose typography classes cannot be loaded on a plain JVM, and for that one test a skip
      # means "the guard did not run", not "the baseline is fine" - the two are easy to confuse when
      # reading a green check. So a skip is turned into a failure here.
      - name: Fail if the font baseline guard did not actually run
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find app/build -name 'TEST-*ListFontBaselineTest.xml')
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::ListFontBaselineTest produced no result XML - the guard did not run"
            echo "test output directories found under app/build:"
            find app/build -maxdepth 3 -type d -name '*test*' || true
            exit 1
          fi
          if grep -l '<skipped' "${reports[@]}"; then
            echo "::error::ListFontBaselineTest skipped itself - the font baseline is currently unguarded"
            exit 1
          fi
          echo "guard ran: ${reports[*]}"

      # Always keep the report, not only on failure: the console output does not say which test was
      # skipped, and a skip is exactly the case that needs looking at.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
